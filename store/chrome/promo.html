<!doctype html>
<!-- Source for the Chrome Web Store promo tiles. Screenshot each element
     at 1x and save as 24-bit PNG (no alpha):
       #small    440 x 280   small promo tile   -> small-promo-440x280.png
       #marquee  1400 x 560  marquee promo tile -> marquee-1400x560.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CourseCrate promo</title>
<style>
  :root {
    --bg: #f6f4ef; --ink: #1d1b16; --muted: #6b665c; --accent: #b4501a;
    --line: #e4dfd3; --surface: #fff;
  }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .tile {
    position: relative; overflow: hidden; box-sizing: border-box;
    background: var(--bg);
    display: flex; align-items: center;
  }
  .tile::after { /* the crate's lid colour as a band along the bottom */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent);
  }
  .name { font-weight: 750; letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .line { color: var(--muted); margin: 0; line-height: 1.3; }

  /* 440 x 280 */
  .small { width: 440px; height: 280px; padding: 0 36px 10px; gap: 24px; }
  .small::after { height: 10px; }
  .small img { width: 112px; height: 112px; flex: none; }
  .small .name { font-size: 38px; }
  .small .line { font-size: 18px; margin-top: 10px; }

  /* 1400 x 560 */
  .marquee { width: 1400px; height: 560px; padding: 0 96px 20px; gap: 72px; justify-content: space-between; }
  .marquee::after { height: 20px; }
  .marquee .brand { display: flex; align-items: center; gap: 40px; }
  .marquee img { width: 200px; height: 200px; flex: none; }
  .marquee .name { font-size: 76px; }
  .marquee .line { font-size: 30px; margin-top: 18px; max-width: 520px; }
  .tree {
    flex: none; width: 470px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 8px 28px rgba(40, 30, 10, .08);
    padding: 22px 26px; font: 19px/1.25 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .tree div { padding: 7px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree .d { font-weight: 650; }
  .tree .f { padding-left: 30px; color: var(--muted); }
  .tree .ok { color: #2f7d4f; float: right; }
</style>
</head>
<body>
<div class="tile small" id="small">
  <img src="../../extension/icons/icon.svg" alt="">
  <div>
    <p class="name">CourseCrate</p>
    <p class="line">Your whole Moodle course, saved in one click.</p>
  </div>
</div>

<div class="tile marquee" id="marquee">
  <div class="brand">
    <img src="../../extension/icons/icon.svg" alt="">
    <div>
      <p class="name">CourseCrate</p>
      <p class="line">Every file of your Moodle course, one folder per section.</p>
    </div>
  </div>
  <div class="tree" aria-hidden="true">
    <div class="d">Psychology in Cinema/</div>
    <div class="d">&nbsp;&nbsp;01 - Course welcome/</div>
    <div class="f">coursewelcome.mp3 <span class="ok">✓</span></div>
    <div class="d">&nbsp;&nbsp;02 - Background information/</div>
    <div class="f">01 - Transference.pdf <span class="ok">✓</span></div>
    <div class="f">02 - Mental illness/ <span class="ok">✓</span></div>
    <div class="f">Links.html <span class="ok">✓</span></div>
  </div>
</div>
</body>
</html>
